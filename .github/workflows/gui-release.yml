name: GUI Release

on:
  push:
    tags:
      - 'gui-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: universal-apple-darwin
          - os: ubuntu-latest
            target: ''
          - os: windows-latest
            target: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check tag matches the configured version
        shell: bash
        run: |
          CONF_VERSION=$(jq -r .version manifest-gui/tauri.conf.json)
          echo "configured version: $CONF_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/gui-v* ]]; then
            TAG_VERSION=${GITHUB_REF#refs/tags/gui-v}
            if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
              echo "tag gui-v$TAG_VERSION does not match tauri.conf.json version $CONF_VERSION"
              exit 1
            fi
          fi

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: manifest-gui/ui/package-lock.json

      - run: npm --prefix manifest-gui/ui ci

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master tip; channel comes from the toolchain input below
        with:
          toolchain: stable
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Build bundles (signed and notarized on macOS)
        shell: bash
        working-directory: manifest-gui
        env:
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.DEVELOPER_ID_CERT_P12 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.DEVELOPER_ID_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.NOTARY_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "$APPLE_CERTIFICATE" ]; then
            echo "DEVELOPER_ID_CERT_P12 secret is not set; refusing to build an unsigned macOS release."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret is not set; updater artifacts cannot be signed."
            exit 1
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            cargo tauri build --target universal-apple-darwin
          else
            cargo tauri build
          fi

      - name: Notarize and staple the dmg
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          DMG=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$NOTARY_PASSWORD" \
            --wait --timeout 90m
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature -v "$DMG"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundles-${{ matrix.os }}
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/gui-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: bundles
          merge-multiple: true

      - name: Assemble latest.json
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/gui-v}
          BASE="https://github.com/proverbiallemon/Manifest/releases/download/gui-v${VERSION}"
          shopt -s globstar nullglob
          # shellcheck disable=SC2012 # bundle filenames are ours; find-based alternative is not worth the complexity here
          MAC_TAR=$(ls bundles/**/*.app.tar.gz | head -1)
          MAC_SIG=$(cat "${MAC_TAR}.sig")
          # shellcheck disable=SC2012 # bundle filenames are ours; find-based alternative is not worth the complexity here
          WIN_EXE=$(ls bundles/**/*-setup.exe | head -1)
          WIN_SIG=$(cat "${WIN_EXE}.sig")
          # shellcheck disable=SC2012 # bundle filenames are ours; find-based alternative is not worth the complexity here
          LIN_APP=$(ls bundles/**/*.AppImage | head -1)
          LIN_SIG=$(cat "${LIN_APP}.sig")
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_url "$BASE/$(basename "$MAC_TAR")" \
            --arg mac_sig "$MAC_SIG" \
            --arg win_url "$BASE/$(basename "$WIN_EXE")" \
            --arg win_sig "$WIN_SIG" \
            --arg lin_url "$BASE/$(basename "$LIN_APP")" \
            --arg lin_sig "$LIN_SIG" \
            '{
              version: $version,
              pub_date: $pub_date,
              platforms: {
                "darwin-x86_64": { url: $mac_url, signature: $mac_sig },
                "darwin-aarch64": { url: $mac_url, signature: $mac_sig },
                "windows-x86_64": { url: $win_url, signature: $win_sig },
                "linux-x86_64": { url: $lin_url, signature: $lin_sig }
              }
            }' > bundles/latest.json
          cat bundles/latest.json

      - name: Verify updater signatures against the committed pubkey
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          KEY=$(jq -r .plugins.updater.pubkey manifest-gui/tauri.conf.json | base64 -d | tail -1)
          shopt -s globstar nullglob
          VERIFIED=0
          for f in bundles/**/*.app.tar.gz bundles/**/*-setup.exe bundles/**/*.AppImage; do
            base64 -d "$f.sig" > /tmp/sig.minisig
            minisign -Vm "$f" -x /tmp/sig.minisig -P "$KEY"
            VERIFIED=$((VERIFIED + 1))
          done
          if [ "$VERIFIED" -ne 3 ]; then
            echo "expected to verify 3 updater artifacts, verified $VERIFIED"
            exit 1
          fi

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Manifest GUI ${{ github.ref_name }}
          files: |
            bundles/**/*.dmg
            bundles/**/*.app.tar.gz
            bundles/**/*.app.tar.gz.sig
            bundles/**/*.msi
            bundles/**/*.exe
            bundles/**/*.exe.sig
            bundles/**/*.deb
            bundles/**/*.rpm
            bundles/**/*.AppImage
            bundles/**/*.AppImage.sig
            bundles/latest.json
          body: |
            ## Manifest GUI ${{ github.ref_name }}

            ### Downloads
            - **macOS** (universal, signed and notarized): the `.dmg`, or `brew install --cask pocketbeardev/manifest/manifest`
            - **Windows**: the `-setup.exe` installer (unsigned; SmartScreen will warn)
            - **Linux**: `.AppImage`, `.deb`, or `.rpm` (unsigned)

            The app updates itself from this release onward (macOS, Windows, AppImage).
            The `.tar.gz`, `.sig`, and `latest.json` files are updater plumbing; download an installer above.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage stable-name installers for the rolling release
        shell: bash
        run: |
          shopt -s globstar nullglob
          cp bundles/**/*.dmg bundles/Manifest-universal.dmg
          cp bundles/**/*-setup.exe bundles/Manifest-setup.exe
          cp bundles/**/*.AppImage bundles/Manifest.AppImage
          ls -la bundles/Manifest-universal.dmg bundles/Manifest-setup.exe bundles/Manifest.AppImage

      - name: Publish the rolling updater manifest
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: gui-latest
          name: Manifest GUI updater manifest
          make_latest: "false"
          files: |
            bundles/latest.json
            bundles/Manifest-universal.dmg
            bundles/Manifest-setup.exe
            bundles/Manifest.AppImage
          body: Machine-consumed rolling manifest and stable-name installers; humans browsing want the versioned releases.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
