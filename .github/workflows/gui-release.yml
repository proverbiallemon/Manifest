name: GUI Release

on:
  push:
    tags:
      - 'gui-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: universal-apple-darwin
          - os: ubuntu-latest
            target: ''
          - os: windows-latest
            target: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check tag matches the configured version
        if: startsWith(github.ref, 'refs/tags/gui-v')
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/gui-v}
          CONF_VERSION=$(python3 -c "import json;print(json.load(open('manifest-gui/tauri.conf.json'))['version'])")
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "tag gui-v$TAG_VERSION does not match tauri.conf.json version $CONF_VERSION"
            exit 1
          fi

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: manifest-gui/ui/package-lock.json

      - run: npm --prefix manifest-gui/ui ci

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master tip; channel comes from the toolchain input below
        with:
          toolchain: stable
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build bundles (signed and notarized on macOS)
        shell: bash
        working-directory: manifest-gui
        env:
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.DEVELOPER_ID_CERT_P12 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.DEVELOPER_ID_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.NOTARY_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -z "$APPLE_CERTIFICATE" ]; then
              echo "DEVELOPER_ID_CERT_P12 secret is not set; refusing to build an unsigned macOS release."
              exit 1
            fi
            cargo tauri build --target universal-apple-darwin
          else
            cargo tauri build
          fi

      - name: Upload build artifacts (dry runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/gui-v') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundles-${{ matrix.os }}
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Release
        if: startsWith(github.ref, 'refs/tags/gui-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Manifest GUI ${{ github.ref_name }}
          files: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          body: |
            ## Manifest GUI ${{ github.ref_name }}

            ### Downloads
            - **macOS** (universal, signed and notarized): the `.dmg`
            - **Windows**: the `-setup.exe` installer (unsigned; SmartScreen will warn)
            - **Linux**: `.AppImage`, `.deb`, or `.rpm` (unsigned)

            macOS installs are also available via Homebrew once the cask is published.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
