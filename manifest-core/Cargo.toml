[package]
name = "manifest-core"
version = "0.2.0"
edition = "2021"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rayon = "1"
tempfile = "3"
